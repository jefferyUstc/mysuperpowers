# conda env create -f environment.yml
# Scripts need pymupdf, pyyaml, Pillow, markdown-it-py, premailer, and git (repo modes).
# If `import pymupdf` fails with GLIBCXX_3.4.32 on an older Linux, run
# `conda install -c conda-forge "libstdcxx-ng>=14"` in the env, or pin pymupdf<1.24.
name: wechat-science-post
channels:
  - conda-forge
dependencies:
  - python=3.12
  - git
  - pyyaml>=6.0
  - pillow>=10.0
  - pip
  - pip:
      - pymupdf>=1.24
      - markdown-it-py>=3.0
      - premailer>=3.10
